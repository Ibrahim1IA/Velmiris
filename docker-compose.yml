# VELMIRYS — déploiement Droplet (image pré-buildée via GHCR)
# Workflow : build local (deploy.ps1) → push GHCR → droplet pull.
# Usage droplet : docker compose pull && docker compose up -d
# Les NEXT_PUBLIC_* sont inlinées au build (deploy.ps1 passe les --build-arg).
# Rollback : éditer IMAGE_TAG=sha-xxxxxxx dans le .env du droplet.
#
# ⚠️ Ne PAS builder sur le droplet (1 GB RAM → node heap explosé).
#    Le build se fait en local, le droplet ne fait que pull.

services:
  web:
    image: ghcr.io/ibrahim1ia/velmirys-web:${IMAGE_TAG:-latest}
    # Fallback local (déconseillé sur droplet 1 GB) :
    #   build:
    #     context: ./web
    #     dockerfile: Dockerfile
    #   deploy.ps1 passe les --build-arg NEXT_PUBLIC_* automatiquement.
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
